# Prenese zadnje zagone modelov in objavi stran na GitHub Pages.
#   Evropa:    ECMWF IFS (build.py)
#   Slovenija: ALADIN/SI (ARSO) in ICON-D2 (DWD) (build_si.py)
# Teče vsake 3 ure; vsak builder vedno vzame zadnji dokončani zagon.
name: Update forecast

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "build.py", "build_si.py", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Evropa (ECMWF)
        run: python -u build.py --out site/data --workers 6

      - name: Slovenija (ALADIN/SI, ICON-D2)
        run: python -u build_si.py --out site/slovenija/data --workers 8

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
