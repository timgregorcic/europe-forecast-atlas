# Fetch the latest ECMWF run, build the Europe data and publish the site to GitHub Pages.
# Runs after each 00 and 12 UTC run is complete on Open Data (about 7-8 h after the run time).
name: Update forecast

on:
  schedule:
    - cron: "17 8 * * *"    # 00 UTC run
    - cron: "17 20 * * *"   # 12 UTC run
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "build.py", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Build forecast data
        run: python -u build.py --out site/data --workers 6

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
